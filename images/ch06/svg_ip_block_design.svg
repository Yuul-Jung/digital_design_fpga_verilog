<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 200" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">IP 기반 LED 점멸 Block Design</title><desc id="d">clk 포트가 Clocking Wizard, Binary Counter, Slice를 거쳐 counter[25]가 led 포트로 나가는 블록도</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3D46"/></marker></defs><rect x="1" y="1" width="1008" height="198" rx="14" fill="#FFFFFF" stroke="#DADBD6" stroke-width="2"/><polygon points="22,82 100,82 88,118 10,118" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="55.0" y="105.6" font-size="16" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">clk</text><path d="M100,100 L150,100" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="150" y="55" width="200" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="250.0" y="94.47500000000001" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Clocking Wizard</text><text x="250.0" y="117.42500000000001" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">clk_in1 → clk_out1</text><rect x="440" y="55" width="200" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="540.0" y="94.47500000000001" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Binary Counter</text><text x="540.0" y="117.42500000000001" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">26비트 Up · Q[25:0]</text><rect x="730" y="55" width="150" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="805.0" y="94.47500000000001" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Slice</text><text x="805.0" y="117.42500000000001" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">Din[25] → Dout</text><path d="M350,100 L440,100" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="356.3" y="77" width="77.4" height="20" fill="#FFFFFF"/><text x="395" y="92" font-size="14" text-anchor="middle" fill="#4635B1" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">clk_out1</text><path d="M640,100 L730,100" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="650.6" y="77" width="68.8" height="20" fill="#FFFFFF"/><text x="685" y="92" font-size="14" text-anchor="middle" fill="#4635B1" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Q[25:0]</text><polygon points="922,82 1000,82 988,118 910,118" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="955.0" y="105.6" font-size="16" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">led</text><path d="M880,100 L910,100" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="505" y="185" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">counter[25] = 100MHz / 2^26 ≈ 1.49Hz</text></svg>
