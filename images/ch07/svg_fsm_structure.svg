<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">FSM 기본 구조</title><desc id="d">입력과 현재상태 ps로 차기상태 ns를 계산하고, 클록 상승 에지에 상태 레지스터가 ns를 ps로 저장하며, Moore 출력은 ps로, Mealy 출력은 ps와 입력으로 만드는 구조도</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3D46"/></marker></defs><rect x="1" y="1" width="1098" height="328" rx="14" fill="#FFFFFF" stroke="#DADBD6" stroke-width="2"/><polygon points="22,92 110,92 98,128 10,128" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="60.0" y="115.6" font-size="16" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">입력</text><path d="M110,110 L170,110" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="170" y="60" width="200" height="100" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="270.0" y="104.47500000000001" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Next State Logic</text><text x="270.0" y="127.42500000000001" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">차기상태 · 조합</text><rect x="450" y="60" width="200" height="100" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="550.0" y="104.47500000000001" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">State Register</text><text x="550.0" y="127.42500000000001" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">현재상태 · 플립플롭</text><path d="M370,110 L450,110" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="396.7" y="86" width="26.6" height="21" fill="#FFFFFF"/><text x="410" y="102" font-size="15" text-anchor="middle" fill="#4635B1" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">ns</text><polygon points="512,230 600,230 588,266 500,266" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="550.0" y="253.6" font-size="16" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">clk</text><path d="M550,230 L550,160" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M650,110 L710,110" fill="none" stroke="#3A3D46" stroke-width="2.2" stroke-linejoin="round"/><rect x="664.0" y="86" width="26.6" height="21" fill="#FFFFFF"/><text x="668" y="102" font-size="15" text-anchor="start" fill="#4635B1" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">ps</text><circle cx="690" cy="110" r="4" fill="#3A3D46"/><path d="M690,110 L690,20 L270,20 L270,60" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><circle cx="710" cy="110" r="4" fill="#3A3D46"/><path d="M710,110 L710,80 L760,80" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M710,110 L710,220 L760,220" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="760" y="40" width="200" height="80" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="860.0" y="74.47500000000001" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Moore Output</text><text x="860.0" y="97.42500000000001" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">출력 = f(ps)</text><rect x="760" y="180" width="200" height="80" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="860.0" y="214.475" font-size="17" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">Mealy Output</text><text x="860.0" y="237.425" font-size="15" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">출력 = f(ps, 입력)</text><circle cx="140" cy="110" r="4" fill="#3A3D46"/><path d="M140,110 L140,300 L740,300 L740,250 L760,250" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><polygon points="1002,62 1090,62 1078,98 990,98" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="1040.0" y="84.9" font-size="14" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">Moore 출력</text><path d="M960,80 L990,80" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><polygon points="1002,202 1090,202 1078,238 990,238" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="1040.0" y="224.9" font-size="14" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">Mealy 출력</text><path d="M960,220 L990,220" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/></svg>
