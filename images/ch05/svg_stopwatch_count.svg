<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">스톱워치 제어·카운트 경로</title><desc id="d">start_stop_control의 running과 clock_divider_10ms의 tick_0p01s, sw[0]를 AND한 count_enable로 stopwatch_counter_4digit를 증가시키는 블록도</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3D46"/></marker></defs><rect x="1" y="1" width="998" height="348" rx="14" fill="#FFFFFF" stroke="#DADBD6" stroke-width="2"/><rect x="150" y="60" width="220" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="260.0" y="100.125" font-size="15" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">clock_divider_10ms</text><text x="260.0" y="120.375" font-size="13" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">u_tick · enable = sw[0] &amp;&amp; running</text><rect x="480" y="60" width="120" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="540.0" y="99.14999999999999" font-size="18" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">&amp;&amp;</text><text x="540.0" y="123.44999999999999" font-size="16" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">count_enable</text><rect x="680" y="60" width="280" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="820.0" y="100.125" font-size="15" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">stopwatch_counter_4digit</text><text x="820.0" y="120.375" font-size="13" text-anchor="middle" fill="#5B5E68