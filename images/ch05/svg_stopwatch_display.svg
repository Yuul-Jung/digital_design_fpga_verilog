<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">스톱워치 FND 표시 경로</title><desc id="d">digit0~3을 fnd_mux_4digit_dp가 digit_sel에 따라 선택해 current_digit을 fnd_decoder로 보내 seg를 만들고 an과 dp를 출력하는 블록도</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3D46"/></marker></defs><rect x="1" y="1" width="998" height="318" rx="14" fill="#FFFFFF" stroke="#DADBD6" stroke-width="2"/><polygon points="22,87 140,87 128,123 10,123" fill="#E8F3EC" stroke="#21824F" stroke-width="2.5"/><text x="75.0" y="110.6" font-size="16" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">digit0~3</text><rect x="200" y="60" width="240" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="320.0" y="100.125" font-size="15" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">fnd_mux_4digit_dp</text><text x="320.0" y="120.375" font-size="13" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">u_mux</text><path d="M140,105 L200,105" fill="none" stroke="#3A3D46" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="560" y="60" width="240" height="90" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2.5"/><text x="680.0" y="99.8" font-size="16" text-anchor="middle" fill="#15171C" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">fnd_decoder</text><text x="680.0" y="121.4" font-size="14" text-anchor="middle" fill="#5B5E68" font-weight="400" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif">u_decoder</text><path d="M440,105 L560,105" fill="none" stroke="#3A3D46" stroke-